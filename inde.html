
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Scanner</title>

    <meta name="theme-color" content="#1769e0">
    <meta name="description" content="Scanner inteligente de produtos de supermercado">

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <div class="logo">🛒</div>
        <div>
            <h1>Meu Scanner</h1>
            <p>Seu catálogo inteligente de produtos</p>
        </div>
    </header>

    <main class="container">

        <section class="welcome">
            <h2>Olá!</h2>
            <p>Identifique, cadastre e encontre produtos facilmente.</p>
        </section>

        <section class="main-actions">

            <button class="action-card primary" id="scanButton">
                <span>📷</span>
                <strong>Escanear produto</strong>
                <small>Identifique um produto pela câmera</small>
            </button>

            <button class="action-card" id="catalogButton">
                <span>🛒</span>
                <strong>Catálogo de produtos</strong>
                <small>Consulte os produtos cadastrados</small>
            </button>

            <button class="action-card" id="searchButton">
                <span>🔎</span>
                <strong>Pesquisar produtos</strong>
                <small>Encontre produtos pelo nome</small>
            </button>

            <button class="action-card" id="historyButton">
                <span>📚</span>
                <strong>Histórico</strong>
                <small>Veja seus últimos escaneamentos</small>
            </button>

        </section>

        <section class="status-card">
            <h3>Status do aplicativo</h3>
            <p id="appStatus">Aplicativo iniciado.</p>
        </section>

    </main>

    <footer>
        <p>Meu Scanner © 2026</p>
    </footer>

    <script src="js/app.js"></script>

</body>
</html>
