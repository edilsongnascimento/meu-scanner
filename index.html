<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeuScaner</title>
    <meta name="theme-color" content="#1769e0">
    <meta name="description" content="Pesquise, compare e favorite produtos.">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">🛒</div>
        <div>
            <h1>MeuScaner</h1>
            <p>Pesquise e compare produtos</p>
        </div>
        <button class="header-account-link install-button" id="installButton" type="button">Instalar app</button>
        <a class="header-account-link" href="./conta.html">Minha conta</a>
    </header>

    <main class="container">
        <section class="welcome">
            <h2>Olá!</h2>
            <p>Use uma única tela para buscar, comparar e gerenciar seus favoritos.</p>
            <p>
                <a href="./catalogo.html#buscar" class="primary-button">Abrir pesquisa</a>
            </p>
        </section>

        <section class="main-actions">
            <button class="action-card primary" id="scannerButton" type="button">
                <span>📷</span>
                <strong>Ler produto</strong>
                <small>Escaneie o código ou leia o rótulo</small>
            </button>
            <button class="action-card primary" id="searchButton" type="button">
                <span>🔎</span>
                <strong>Pesquisar produtos</strong>
                <small>Busca principal em uma só tela</small>
            </button>
        </section>

        <section class="status-card">
            <p id="installMessage" class="install-message" role="status" hidden></p>
            <h3>Como funciona</h3>
            <p>As buscas vêm diretamente do Open Food Facts. Somente os produtos que você favoritar são guardados na sua conta.</p>
        </section>
    </main>

    <footer>
        <p>MeuScaner © 2026</p>
    </footer>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
